<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#070d18;overflow:hidden}
.bg{position:absolute;inset:0;background:url(../../public/home/mapa-noturno.webp) center 38%/cover}

img.logo{height:84px}
.eye{margin-top:26px;font:600 17px/1 Inter;letter-spacing:.2em;text-transform:uppercase;color:#d4a64a}

h1 em{color:#d4a64a}
.foot{margin-top:30px;font:500 15px/1 Inter;letter-spacing:.24em;text-transform:uppercase;color:#8e97a6}
.rule{position:absolute;left:0;right:0;bottom:0;height:6px;background:#d4a64a}

<div class="bg"></div><div class="shade"></div>
<div class="c">
<img class="logo" src="logo.svg">

<div class="foot" id="foot"></div>
</div><div class="rule"></div>
<script>
const L={pt:{eye:"Contribuições da arte imigrante, 1918–1989",t:"Trajetórias de artistas do <em>Leste Europeu<br>e da Áustria</em> no Brasil",foot:"A partir do acervo do MAC USP"},

</script></body></html>
